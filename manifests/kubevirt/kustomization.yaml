# KubeVirt v1.9.0 (laatste stable, sept 2026 - github.com/kubevirt/kubevirt/releases).
# Bewust gepind i.p.v. "latest"/"stable.txt" te volgen, voor reproduceerbare
# deployments. Bij een upgrade: versie hier bewust ophogen, niet automatisch.
#
# Toepassen: kubectl apply -k manifests/kubevirt/
# Wachten op gereed zijn: kubectl -n kubevirt wait kv kubevirt --for condition=Available --timeout=5m
#
# Dit raakt geen bestaande Cilium/Hubble-configuratie of andere namespaces -
# KubeVirt is CNI-onafhankelijk en installeert alleen in zijn eigen
# "kubevirt" namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-operator.yaml
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-cr.yaml
